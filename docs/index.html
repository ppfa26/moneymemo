<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>머니메모 · 약관 안내</title>
  <style>
    :root { --orange:#ff6f0f; --ink:#191f28; --sub:#4e5968; --line:#e5e8eb; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
      color:var(--ink); background:linear-gradient(160deg,#ff8a2b,#ff6f0f 60%,#f0402a);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card { background:#fff; border-radius:22px; padding:36px 28px; max-width:420px; width:100%;
      box-shadow:0 20px 60px rgba(0,0,0,0.18); text-align:center; }
    h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
    p { margin-top:8px; font-size:14px; color:var(--sub); }
    .links { margin-top:24px; display:flex; flex-direction:column; gap:12px; }
    a { display:block; padding:15px; border-radius:14px; background:#f2f4f6; color:var(--ink);
      font-weight:700; text-decoration:none; font-size:15px; transition:.15s; }
    a:hover { background:#fff3ea; color:var(--orange); }
    .foot { margin-top:22px; font-size:12px; color:#8b95a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>머니메모</h1>
    <p>자동이체 및 경조사비 메모노트</p>
    <div class="links">
      <a href="./terms.html">서비스 이용약관</a>
      <a href="./privacy.html">개인정보처리방침</a>
    </div>
    <div class="foot">© 2026 모두의사업친구</div>
  </div>
</body>
</html>
